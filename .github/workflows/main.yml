# /relese = release funds to tagged user profile via BOT
@client.on(events.NewMessage(outgoing=True, pattern=r"^/relese$"))
async def release_funds(event):
    if not is_owner(event):
        return
    
    if not event.is_group:
        await event.respond("❌ Use /relese inside a deal group.")
        return

    await event.delete()

    reply = await event.get_reply_message()
    if not reply:
        await event.respond("⚠️ Please reply/slide to the user's message when using /relese to release funds to them.")
        return

    sender = await reply.get_sender()
    if not sender:
        await event.respond("❌ Could not identify the user from the replied message.")
        return

    user_id = sender.id
    first_name = getattr(sender, 'first_name', 'User')
    username = getattr(sender, 'username', None)

    if username:
        user_mention = f"[@{username}](https://t.me/{username})"
    else:
        user_mention = f"[{first_name}](tg://user?id={user_id})"

    await bot_client.send_message(
        event.chat_id,
        f"**Funds Released successfully 🤝\n\n"
        f"Funds have been sent to your QR code ({user_mention}) ✅\n\n"
        f"MM Service Complete ✅**",
        parse_mode='markdown',
        link_preview=False
    )


