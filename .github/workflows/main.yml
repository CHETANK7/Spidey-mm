# /mm = create group from DM/anywhere, add bot, set admin, set profile pic, and post terms via BOT
@client.on(events.NewMessage(outgoing=True, pattern=r"^/mm$"))
async def create_group(event):
    if not is_owner(event):
        return

    status = await event.respond("⏳ Creating new group and setting up bot...")

    try:
        # Create a new supergroup with description
        result = await client(
            functions.channels.CreateChannelRequest(
                title=GROUP_NAME,
                about=GROUP_ABOUT,
                broadcast=False,
                megagroup=True
            )
        )

        group = result.chats[0]
        group_id = group.id

        # Enable join requests approval
        try:
            await client(
                functions.messages.ToggleChatJoinRequestRequest(
                    peer=group,
                    enabled=True
                )
            )
        except Exception:
            pass

        # Add the bot to the newly created group and promote it
        try:
            bot_entity = await client.get_entity(BOT_USERNAME)

            await client(
                functions.channels.InviteToChannelRequest(
                    channel=group,
                    users=[bot_entity]
                )
            )
            
            # Promote the bot to Administrator with full rights
            admin_rights = types.ChatAdminRights(
                change_info=True,
                post_messages=True,
                edit_messages=True,
                delete_messages=True,
                ban_users=True,
                invite_users=True,
                pin_messages=True,
                add_admins=True,
                manage_call=True,
                anonymous=False
            )
            await client(
                functions.channels.EditAdminRequest(
                    channel=group,
                    user_id=bot_entity,
                    admin_rights=admin_rights,
                    rank="MM Bot"
                )
            )
        except Exception as bot_err:
            print(f"Failed to add or promote bot: {bot_err}")

        # Set profile picture if the image file exists at the specified path
        if os.path.exists(PROFILE_PIC_PATH):
            try:
                uploaded_file = await client.upload_file(PROFILE_PIC_PATH)
                await client(
                    functions.channels.EditPhotoRequest(
                        channel=group,
                        photo=uploaded_file
                    )
                )
            except Exception as photo_err:
                print(f"Failed to set profile picture: {photo_err}")
        else:
            print(f"Profile picture not found at: {PROFILE_PIC_PATH}")

        # Export chat invite link
        invite = await client(
            functions.messages.ExportChatInviteRequest(
                peer=group
            )
        )

        # Updated text for /mm response with GC link in bold text font
        await status.edit(
            "**🥂 Thank you for choosing @ocyzo MM!\n\n"
            "👇 Please join the GC and share the link with your dealer.\n\n"
            "📌 Keep all deal-related communication inside the GC for a smooth and secure deal.\n\n"
            f"{invite.link}**",
            parse_mode='markdown'
        )

        # Terms message sent natively by the bot client
        terms_text = (
            "**Hey. Please state the terms of the deal.\n\n"
            "- What is the deal?\n"
            "- Who is the buyer/seller?\n"
            "- What is the agreed price and which crypto?\n"
            "- Include any other relevant information.\n\n"
            "• i am not dealing below 50rs ~ @ocyzo**"
        )
        
        await bot_client.send_message(group_id, terms_text, parse_mode='markdown')

    except Exception as e:
        await status.edit(
            "❌ Could not create the group.\n"
            f"{type(e).__name__}: {e}"
        )


# /delete = delete/destroy the group automatically
@client.on(events.NewMessage(outgoing=True, pattern=r"^/delete$"))
async def delete_group(event):
    if not is_owner(event):
        return

    if not event.is_group:
        await event.respond("❌ Use /delete inside a group to delete it.")
        return

    try:
        await event.respond("🗑️ Deleting group...")
        await client(
            functions.channels.DeleteChannelRequest(
                channel=await event.get_input_chat()
            )
        )
    except Exception as e:
        await event.respond(
            f"❌ Delete failed: {type(e).__name__}: {e}"
        )


# Capture text messages from group members for deal terms/amounts
@client.on(events.NewMessage(incoming=True))
async def capture_deal_terms(event):
    if not event.is_group:
        return
    
    text = event.raw_text
    match = re.search(r"(?:₹|rs\.?|inr)\s*(\d+)", text, re.IGNORECASE)
    if not match:
        match = re.search(r"(\d+)\s*(?:₹|rs|inr)?", text, re.IGNORECASE)
        
    if match:
        amount = match.group(1)
        group_deal_amounts[event.chat_id] = amount


# Automatically detect payment screenshots sent by members
@client.on(events.NewMessage(incoming=True))
async def capture_payment_screenshot(event):
    if not event.is_group or not event.photo:
        return

    try:
        path = await event.download_media()
        extracted_text = ""

        if OCR_AVAILABLE:
            try:
                img = Image.open(path)
                extracted_text = pytesseract.image_to_string(img)
            except Exception:
                pass
        
        if os.path.exists(path):
            os.remove(path)

        full_context = f"{event.raw_text or ''}\n{extracted_text}"

        amt_match = re.search(r"(?:₹|rs\.?|inr)\s*([\d,]+(?:\.\d{2})?)", full_context, re.IGNORECASE)
        if not amt_match:
            amt_match = re.search(r"([\d,]+\.\d{2})\s*(?:₹|rs|inr)?", full_context, re.IGNORECASE)

        if amt_match:
            raw_amt = amt_match.group(1).replace(",", "")
            group_deal_amounts[event.chat_id] = raw_amt

    except Exception as e:
        print(f"Error parsing payment screenshot: {e}")


# /qr = calculate amount + ₹10 fee and show UPI text via BOT
@client.on(events.NewMessage(outgoing=True, pattern=r"^/qr$"))
async def qr_command(event):
    if not is_owner(event):
        return
    
    if not event.is_group:
        await event.respond("❌ Use /qr inside a deal group.")
        return

    chat_id = event.chat_id
    amount_str = group_deal_amounts.get(chat_id)

    await event.delete()

    if amount_str is None:
        await bot_client.send_message(chat_id, "⚠️ No deal amount detected yet. Make sure the users have filled and sent the terms with the price first!")
        return

    try:
        amount = int(float(amount_str))
    except ValueError:
        amount = 0

    fee = 10
    total = amount + fee

    qr_text = (
        f"**Pay ₹{amount} + Fee: ₹{fee} = ₹{total} INR**\n\n"
        "**To UPI:** `chetanxowns@fam`"
    )

    await bot_client.send_message(chat_id, qr_text, parse_mode='markdown')


