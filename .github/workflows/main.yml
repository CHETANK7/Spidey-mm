async def main():
    print("Starting Telegram user account...")
    await client.start()

    print("Starting Telegram bot account...")
    await bot_client.start(bot_token=BOT_TOKEN)

    me = await client.get_me()
    bot_me = await bot_client.get_me()

    if me.bot:
        print("ERROR: You logged in with a BOT account for the main client.")
        print("Use your normal Telegram phone account.")
        return

    print(f"Logged in as User: {me.first_name} (ID: {me.id})")
    print(f"Logged in as Bot: @{bot_me.username}")
    print("Commands: /mm, /lock, /unlock, /recived, /relese, /refund, /vouch, /qr, /delete")
    print("Running...")

    # Run both the user client and bot client simultaneously
    await asyncio.gather(
        client.run_until_disconnected(),
        bot_client.run_until_disconnected()
    )


if __name__ == "__main__":
    asyncio.run(main())
    
